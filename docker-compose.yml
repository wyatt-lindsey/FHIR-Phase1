# HAPI FHIR server backed by PostgreSQL, so loaded data survives restarts.
#
# The plain `docker run hapiproject/hapi` image keeps everything in an
# in-memory database: data disappears on restart, and a few hundred Synthea
# patients exhaust Java's memory. This setup stores data in Postgres instead.
#
#   docker compose up -d       start (first start takes 1-2 minutes)
#   docker compose stop        stop, keeping the data
#   docker compose start       start again
#   docker compose down        remove containers, keep the data
#   docker compose down -v     remove containers AND delete all FHIR data
#
# Based on the example in the hapi-fhir-jpaserver-starter README.

services:
  hapi:
    container_name: hapi
    image: hapiproject/hapi:latest
    ports:
      - "8080:8080"
    environment:
      # Let Java use 75% of Docker's memory instead of the default 25%
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
    configs:
      - source: hapi
        target: /app/config/application.yaml
    depends_on:
      - db
    restart: unless-stopped

  db:
    container_name: hapi-db
    image: postgres:16
    environment:
      POSTGRES_DB: hapi
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin   # local synthetic data only; never reuse for anything real
    volumes:
      - hapi-pgdata:/var/lib/postgresql/data
    restart: unless-stopped

configs:
  hapi:
    file: ./hapi.application.yaml

volumes:
  hapi-pgdata:
